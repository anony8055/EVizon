<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evizon – Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 via-gray-900 to-black text-white p-6 flex justify-center">

<div class="w-full max-w-3xl space-y-6">

    <!-- HEADER -->
    <div class="text-center">
        <h1 class="text-4xl font-bold tracking-wide">Evizon System</h1>
        <p class="text-gray-400 mt-1">AI Image Intelligence & Archive Engine</p>
    </div>

    <!-- UPLOAD SECTION -->
    <div class="bg-gray-800/50 backdrop-blur-xl rounded-2xl p-5 border border-gray-700">
        <h2 class="text-xl font-semibold mb-3">Upload Event Photo</h2>
        <form id="uploadForm" class="flex gap-3">
            <input type="file" name="file" required 
            class="w-full text-sm text-gray-300 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:bg-blue-700 file:text-white hover:file:bg-blue-600 transition">
            <button type="submit" 
            class="px-5 py-2 bg-blue-700 rounded-lg hover:bg-blue-600 transition text-sm">Upload</button>
        </form>
    </div>

    <!-- MANUAL FILTER SEARCH SECTION -->
    <div class="bg-gray-800/50 backdrop-blur-xl rounded-2xl p-5 border border-gray-700">
        <h2 class="text-xl font-semibold mb-3">Search Photos (Filter)</h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

            <input id="eventBox" placeholder="Event name..."
            class="px-3 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:border-blue-400 outline-none text-sm">

            <select id="deptBox"
            class="px-3 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:border-blue-400 outline-none text-sm text-gray-300">
                <option value="">Department</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="ME">ME</option>
            </select>

            <input type="date" id="dateBox"
            class="px-3 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:border-blue-400 outline-none text-sm">

            <select id="catBox"
            class="px-3 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:border-blue-400 outline-none text-sm text-gray-300">
                <option value="">Category</option>
                <option value="stage">Stage</option>
                <option value="audience">Audience</option>
                <option value="award">Award</option>
                <option value="chaos">Chaos</option>
            </select>

        </div>

        <button onclick="searchPhotos()" 
        class="w-full mt-4 py-2 bg-blue-700 rounded-lg hover:bg-blue-600 transition text-sm">Search</button>
    </div>

    <!-- NATURAL QUERY SEARCH SECTION -->
    <div class="bg-gray-800/50 backdrop-blur-xl rounded-2xl p-5 border border-gray-700">
        <h2 class="text-xl font-semibold mb-3">Search Photos (Natural Query)</h2>
        <input id="chatQuery" placeholder="Ask like a human... e.g. 'DevFest photos 2024 CSE'" 
        class="w-full p-2 rounded bg-gray-900 border border-gray-600 focus:border-blue-400 outline-none text-sm">
        <button onclick="searchEvent()" 
        class="w-full mt-3 py-2 bg-blue-600 rounded-lg hover:bg-blue-500 transition text-sm">Search</button>
    </div>

    <!-- RESULTS GRID (Unified for both searches) -->
    <div id="resultsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4 p-4 bg-gray-900/30 rounded-xl border border-gray-800 min-h-[120px]">
        <!-- Images appear here -->
    </div>

    <!-- ZIP GENERATION -->
    <div class="bg-gray-800/50 backdrop-blur-xl rounded-2xl p-5 border border-gray-700">
        <h2 class="text-xl font-semibold mb-3">Generate Album ZIP</h2>
        <div class="flex gap-3">
            <input id="zipEventBox" placeholder="Enter event for album..."
            class="w-full px-3 py-2 rounded-lg bg-gray-900 border border-gray-600 focus:border-blue-400 outline-none text-sm">
            <button onclick="makeAlbum()" 
            class="px-5 py-2 bg-blue-700 rounded-lg hover:bg-blue-600 transition text-sm">Create ZIP</button>
        </div>
    </div>

    <!-- DOWNLOAD BUTTON (appears when ZIP is ready) -->
    <button id="downloadZipBtn" onclick="downloadAlbum()" 
    class="w-full py-2 bg-green-700 rounded-lg hover:bg-green-600 transition text-sm mt-3 hidden">
    Download Album ZIP
    </button>

</div>

<script>
// Natural search
async function searchEvent() {
    const query = document.getElementById("chatQuery").value.trim();
    if (!query) {
        alert("Enter something to search, admin!");
        return;
    }

    const res = await fetch(`/search?q=${encodeURIComponent(query)}`);

    if(!res.ok){
        alert("Natural search failed: " + res.status);
        return;
    }

    const data = await res.json();
    const grid = document.getElementById("resultsGrid");
    grid.innerHTML = "";

    data.results.forEach(p => {
        const img = document.createElement("img");
        img.src = `/uploads/${p.photo_url.split("/").pop()}`;
        img.className = "rounded-xl border border-gray-600";
        grid.appendChild(img);
    });

    alert(`Natural search found ${data.count} photos`);
}

// Manual filter search
async function searchPhotos() {
    const event = document.getElementById("eventBox").value.trim();
    const dept = document.getElementById("deptBox").value.trim();
    const date = document.getElementById("dateBox").value.trim();
    const cat = document.getElementById("catBox").value.trim();

    const res = await fetch(`/filter-search?event=${event}&department=${dept}&date=${date}&category=${cat}`);

    if(!res.ok){
        alert("Search failed: " + res.status);
        return;
    }
    const data = await res.json();

    const grid = document.getElementById("resultsGrid");
    grid.innerHTML = "";

    data.results.forEach(p => {
        const img = document.createElement("img");
        img.src = `/uploads/${p.photo_url.split("/").pop()}`;
        img.className = "rounded-xl border border-gray-600";
        grid.appendChild(img);
    });

    alert(`Found ${data.count} photos`);
}

// Upload handling
document.getElementById("uploadForm").onsubmit = async (e) => {
    e.preventDefault();
    const fileInput = e.target.file.files[0];
    const formData = new FormData();
    formData.append("file", fileInput);
    const res = await fetch("/upload", { method: "POST", body: formData });
    alert(await res.text());
};

// ZIP album creation
async function makeAlbum() {
    const event = document.getElementById("zipEventBox").value.trim();
    if (!event) {
        alert("Enter event name!");
        return;
    }

    const res = await fetch(`/make-album?event=${encodeURIComponent(event)}`, {method: "POST"});
    const data = await res.json();

    if (data.photo_count > 0) {
        window.lastZipPath = data.album_zip;
        document.getElementById("downloadZipBtn").classList.remove("hidden");
    }
    alert(`Photos in album: ${data.photo_count}`);
}

// ZIP download
async function downloadAlbum() {
    if (!window.lastZipPath) {
        alert("No album generated yet!");
        return;
    }
    const event = document.getElementById("zipEventBox").value.trim();
    window.location.href = `/download-album?event=${encodeURIComponent(event)}`;
}
</script>

</body>
</html>
